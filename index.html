<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PhishGuard AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0e1a;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container { width: 100%; max-width: 720px; }
  h1 { font-size: 2rem; margin-bottom: 6px; }
  h1 span { color: #00d4ff; }
  .sub { color: #8b949e; margin-bottom: 30px; font-size: 0.95rem; }
  .card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 18px;
  }
  label { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
  textarea, input[type=text] {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    background: #0a0e1a;
    border: 1px solid #1f2937;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 0.95rem;
    resize: vertical;
    font-family: inherit;
  }
  button {
    margin-top: 12px;
    padding: 12px 22px;
    background: linear-gradient(135deg, #00d4ff, #0070f3);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .result { margin-top: 18px; padding: 16px; border-radius: 10px; display: none; }
  .result.show { display: block; }
  .risk-low { background: rgba(0,200,100,0.12); border-left: 4px solid #00c864; }
  .risk-med { background: rgba(255,180,0,0.12); border-left: 4px solid #ffb400; }
  .risk-high { background: rgba(255,60,60,0.12); border-left: 4px solid #ff3c3c; }
  .score { font-size: 2rem; font-weight: 700; }
  .verdict { font-weight: 600; margin: 4px 0 12px; }
  ul { margin-left: 20px; margin-top: 8px; }
  li { margin-bottom: 6px; font-size: 0.9rem; color: #c9d1d9; }
  .tag {
    display: inline-block;
    background: #1f2937;
    color: #8b949e;
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 4px;
    margin-right: 6px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ Phish<span>Guard</span> AI</h1>
  <p class="sub">Real-time phishing & scam detection · Runs 100% in your browser</p>

  <div class="card">
    <label>🔗 Suspicious URL</label>
    <input type="text" id="urlInput" placeholder="https://example.com/login" />
    <button onclick="scanURL()">Scan URL</button>
    <div id="urlResult" class="result"></div>
  </div>

  <div class="card">
    <label>💬 Suspicious Message / SMS / Email</label>
    <textarea id="msgInput" rows="3" placeholder="Paste the message here..."></textarea>
    <button onclick="scanMsg()">Scan Message</button>
    <div id="msgResult" class="result"></div>
  </div>

  <div style="text-align:center;">
    <span class="tag">HTTPS Check</span>
    <span class="tag">Typosquatting</span>
    <span class="tag">Suspicious TLDs</span>
    <span class="tag">URL Shorteners</span>
    <span class="tag">Urgency Detection</span>
    <span class="tag">OTP / KYC Bait</span>
  </div>
</div>

<script>
const BAD_TLDS = ['.xyz','.tk','.ml','.ga','.cf','.gq','.top','.work','.click','.link','.zip','.country','.stream'];
const SHORTENERS = ['bit.ly','tinyurl.com','t.co','goo.gl','ow.ly','is.gd','buff.ly','rebrand.ly','cutt.ly'];
const BRANDS = ['paypal','google','amazon','apple','microsoft','facebook','instagram','netflix','bank','whatsapp','flipkart','sbi','hdfc','icici'];
const URGENCY = ['urgent','immediately','verify now','account suspended','act now','limited time','final warning','click here','expires today','last chance'];
const BAIT = ['otp','kyc','lottery','winner','prize','refund','gift card','crypto','bitcoin','password','login','update your','confirm your','ssn','aadhaar','pan card'];

function riskClass(score) {
  if (score >= 60) return 'risk-high';
  if (score >= 30) return 'risk-med';
  return 'risk-low';
}

function scanURL() {
  const raw = document.getElementById('urlInput').value.trim();
  const box = document.getElementById('urlResult');
  if (!raw) { box.className='result show risk-med'; box.innerHTML='Please enter a URL.'; return; }

  let score = 0;
  const reasons = [];
  const url = raw.toLowerCase();

  if (url.startsWith('http://')) { score += 25; reasons.push('Uses HTTP (not HTTPS) — traffic is unencrypted.'); }
  if (!url.includes('https://') && !url.includes('http://')) { score += 10; reasons.push('Missing protocol — likely malformed or masked link.'); }

  BAD_TLDS.forEach(t => { if (url.includes(t)) { score += 25; reasons.push(`Suspicious TLD detected: ${t}`); }});

  SHORTENERS.forEach(s => { if (url.includes(s)) { score += 20; reasons.push(`URL shortener detected (${s}) — hides real destination.`); }});

  const ipMatch = url.match(/https?:\/\/(\d{1,3}\.){3}\d{1,3}/);
  if (ipMatch) { score += 30; reasons.push('Raw IP address in URL — common in phishing.'); }

  BRANDS.forEach(b => {
    if (url.includes(b)) {
      const legit = ['.'+b+'.com', b+'.com', b+'.in'];
      const isLegit = legit.some(l => url.includes(l));
      if (!isLegit) { score += 30; reasons.push(`Brand name "${b}" used on a non-official domain — possible typosquatting.`); }
    }
  });

  const dots = (url.match(/\./g) || []).length;
  if (dots > 3) { score += 15; reasons.push(`Excessive subdomains (${dots} dots) — often used to fake legitimacy.`); }

  if (url.includes('@')) { score += 20; reasons.push('"@" symbol in URL — can hide the real domain.'); }
  if (url.length > 90) { score += 10; reasons.push('Unusually long URL — common obfuscation trick.'); }
  if (/-/.test(url.split('//')[1] || '')) { score += 5; reasons.push('Hyphenated domain — common in lookalike phishing domains.'); }

  score = Math.min(score, 100);
  if (reasons.length === 0) reasons.push('No common phishing indicators found.');

  const verdict = score >= 60 ? '🚨 High Risk — Do NOT click' : score >= 30 ? '⚠️ Suspicious — Proceed with caution' : '✅ Looks Safe';

  box.className = 'result show ' + riskClass(score);
  box.innerHTML = `<div class="score">${score}/100</div><div class="verdict">${verdict}</div><strong>Why:</strong><ul>${reasons.map(r=>`<li>${r}</li>`).join('')}</ul>`;
}

function scanMsg() {
  const raw = document.getElementById('msgInput').value.trim();
  const box = document.getElementById('msgResult');
  if (!raw) { box.className='result show risk-med'; box.innerHTML='Please enter a message.'; return; }

  let score = 0;
  const reasons = [];
  const msg = raw.toLowerCase();

  URGENCY.forEach(k => { if (msg.includes(k)) { score += 12; reasons.push(`Urgency trigger: "${k}"`); }});
  BAIT.forEach(k => { if (msg.includes(k)) { score += 10; reasons.push(`Sensitive bait keyword: "${k}"`); }});

  if (/https?:\/\/|www\./.test(msg)) { score += 15; reasons.push('Contains an embedded link.'); }
  if (/\b\d{4,8}\b/.test(msg) && msg.includes('otp')) { score += 15; reasons.push('Possible OTP harvesting attempt.'); }
  if (msg.includes('dear customer') || msg.includes('dear user')) { score += 10; reasons.push('Generic greeting — mass phishing indicator.'); }
  if (msg.includes('won') || msg.includes('winner') || msg.includes('prize')) { score += 15; reasons.push('Lottery/prize scam pattern.'); }
  if (msg.includes('bank') && (msg.includes('verify') || msg.includes('update'))) { score += 15; reasons.push('Bank verification scam pattern.'); }

  score = Math.min(score, 100);
  if (reasons.length === 0) reasons.push('No common scam indicators found.');

  const verdict = score >= 60 ? '🚨 High Risk — Likely a scam' : score >= 30 ? '⚠️ Suspicious — Verify before acting' : '✅ Looks Safe';

  box.className = 'result show ' + riskClass(score);
  box.innerHTML = `<div class="score">${score}/100</div><div class="verdict">${verdict}</div><strong>Why:</strong><ul>${reasons.map(r=>`<li>${r}</li>`).join('')}</ul>`;
}
</script>
</body>
</html>
